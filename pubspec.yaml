name: inkastream
description: INKASTREAM
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  material_symbols_icons: ^4.2928.1
  http: ^1.2.0
  html: ^0.15.4
  shared_preferences: ^2.2.2
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  android_intent_plus: ^5.0.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0
  dlna_dart: ^0.1.0
  network_info_plus: ^6.0.0
  wakelock_plus: ^1.2.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0A0A0B"
  adaptive_icon_foreground: "assets/icon/fg.png"

flutter:
  uses-material-design: true
