name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generar carpeta android
        run: flutter create . --platforms=android --project-name inkastream --org com.inka

      - name: Permiso de internet
        run: |
          F=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.INTERNET" "$F" || \
            sed -i '0,/<manifest[^>]*>/s//&\n    <uses-permission android:name="android.permission.INTERNET"\/>/' "$F"
          grep -n "INTERNET" "$F"

      - name: Instalar paquetes
        run: flutter pub get

      - name: Dibujar icono
        run: |
          pip install pillow
          python tool/make_icon.py

      - name: Aplicar icono
        run: dart run flutter_launcher_icons

      - name: Compilar APK release
        run: flutter build apk --release --split-per-abi

      - name: Firmar APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/inka.jks" \
            -storetype PKCS12 -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -dname "CN=INKASTREAM, O=Inka, C=MX"
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          for f in build/app/outputs/flutter-apk/*-release.apk; do
            "$APKSIGNER" sign --ks "$RUNNER_TEMP/inka.jks" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEYSTORE_PASSWORD "$f"
            "$APKSIGNER" verify "$f"
          done

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: inkastream-apk
          path: build/app/outputs/flutter-apk/*-release.apk
