name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generar carpeta android
        run: flutter create . --platforms=android --project-name inkastream --org com.inka

      - name: Instalar paquetes
        run: flutter pub get

      - name: Dibujar icono
        run: |
          pip install pillow
          python tool/make_icon.py

      - name: Aplicar icono
        run: dart run flutter_launcher_icons

      - name: Compilar APK debug
        run: flutter build apk --debug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: inkastream-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
